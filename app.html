<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Pneus - Meses</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="./css/opcao1.css?v=20260531-1">
</head>

<body class="app-body">
  <header class="app-topbar">
    <div class="app-topbar-inner">
      <div class="app-brand">
        <div class="app-brand-mark">
          <img src="suzano-logo.png" alt="Suzano">
        </div>
        <div>
          <h1>Controle de Pneus</h1>
          <p>Meses de avaliação e acompanhamento</p>
        </div>
      </div>

      <div class="app-actions">
        <button class="app-btn danger" type="button" onclick="logout()">
          <i data-lucide="log-out"></i>
          Sair
        </button>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="app-sidebar" aria-label="Navegação principal">
      <a class="side-link active" href="app.html">
        <i data-lucide="calendar-days"></i>
        Meses
      </a>
      <button class="side-link danger" type="button" onclick="logout()">
        <i data-lucide="log-out"></i>
        Sair
      </button>
    </aside>

    <main class="app-main">
      <section class="page-heading" aria-label="Resumo dos meses">
        <div>
          <p class="page-kicker">Operação</p>
          <h2>Meses de controle</h2>
          <p>Crie meses e acompanhe os pneus cadastrados.</p>
        </div>

        <button class="app-btn primary" type="button" onclick="abrirModalMes()">
          <i data-lucide="plus"></i>
          Criar mês
        </button>
      </section>

      <div id="gridMeses" class="cards-grid"></div>
    </main>
  </div>

  <div id="modalMes" class="app-modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Criar mês</h2>
        <button class="close-btn" type="button" onclick="fecharModalMes()" aria-label="Fechar">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="form-grid">
        <div class="span-3">
          <label for="selMes">Mês</label>
          <select id="selMes">
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
            <option value="9">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>

        <div class="span-3">
          <label for="selAno">Ano</label>
          <select id="selAno"></select>
        </div>
      </div>

      <div class="card-actions">
        <button class="app-btn subtle" type="button" onclick="fecharModalMes()">Cancelar</button>
        <button class="app-btn blue" type="button" onclick="confirmarCriarMes()">
          <i data-lucide="check"></i>
          Criar
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/meses.js?v=20260531-3"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
